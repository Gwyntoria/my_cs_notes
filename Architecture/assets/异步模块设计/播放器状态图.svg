<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="540" viewBox="0 0 1180 540" role="img" aria-labelledby="title desc">
  <title id="title">播放器状态转换图</title>
  <desc id="desc">播放器从 Idle 进入 Preparing，再根据音频启动、失败、停止等事件转换为 Playing、Failed 或 Stopping 状态。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L9 4.5 L0 9z" fill="#5f7883"/>
    </marker>
    <style>
      .state { font: 600 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #253c45; }
      .edge-label { font: 14px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #405b66; paint-order: stroke; stroke: #f5f7f1; stroke-width: 6px; stroke-linejoin: round; }
      .edge { fill: none; stroke: #5f7883; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .node { stroke: #78939a; stroke-width: 1.6; }
    </style>
  </defs>

  <rect width="1180" height="540" rx="18" fill="#f5f7f1"/>

  <path d="M67 255 H120" class="edge"/>
  <path d="M260 255 H390" class="edge"/>
  <path d="M570 235 C620 190 655 145 700 115" class="edge"/>
  <path d="M570 255 H940" class="edge"/>
  <path d="M570 275 C620 320 655 365 700 395" class="edge"/>
  <path d="M775 150 C835 180 875 220 940 240" class="edge"/>
  <path d="M1020 220 C1020 36 190 36 190 220" class="edge"/>
  <path d="M700 395 C620 500 480 500 480 290" class="edge"/>

  <circle cx="60" cy="255" r="7" fill="#405b66"/>

  <rect x="120" y="220" width="140" height="70" rx="16" class="node" fill="#c8d9d6"/>
  <text x="190" y="262" text-anchor="middle" class="state">Idle</text>

  <rect x="390" y="220" width="180" height="70" rx="16" class="node" fill="#c8d8a4"/>
  <text x="480" y="262" text-anchor="middle" class="state">Preparing</text>

  <rect x="700" y="80" width="150" height="70" rx="16" class="node" fill="#bdd8e7"/>
  <text x="775" y="122" text-anchor="middle" class="state">Playing</text>

  <rect x="940" y="220" width="160" height="70" rx="16" class="node" fill="#d7c8dc"/>
  <text x="1020" y="262" text-anchor="middle" class="state">Stopping</text>

  <rect x="700" y="360" width="150" height="70" rx="16" class="node" fill="#e8bc9f"/>
  <text x="775" y="402" text-anchor="middle" class="state">Failed</text>

  <text x="325" y="238" text-anchor="middle" class="edge-label">Play(id, url)</text>
  <text x="645" y="165" text-anchor="middle" class="edge-label">AudioStarted(id)</text>
  <text x="755" y="241" text-anchor="middle" class="edge-label">Stop</text>
  <text x="650" y="339" text-anchor="middle" class="edge-label">AudioFailed(id) or timeout</text>
  <text x="860" y="186" text-anchor="middle" class="edge-label">Stop</text>
  <text x="605" y="57" text-anchor="middle" class="edge-label">AudioStopped(id)</text>
  <text x="590" y="487" text-anchor="middle" class="edge-label">Play(id, url)</text>
</svg>
