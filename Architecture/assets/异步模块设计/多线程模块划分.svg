<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="350" viewBox="0 0 1080 350" role="img" aria-labelledby="title desc">
  <title id="title">网络线程与播放器线程通过消息队列双向通信</title>
  <desc id="desc">网络线程向播放器消息队列投递 Play 或 Stop，播放器线程向网络消息队列投递 PlayerStarted 或 PlayerFailed。每个模块在自己的线程中串行消费私有队列。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 4 L0 8z" fill="#607d86"/>
    </marker>
    <marker id="command-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 4 L0 8z" fill="#5f8795"/>
    </marker>
    <marker id="event-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 4 L0 8z" fill="#778b60"/>
    </marker>
    <style>
      .title { font: 600 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #2c454c; }
      .label { font: 600 17px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #2c454c; }
      .note { font: 14px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #526b73; }
      .message { font: 13px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #526b73; paint-order: stroke; stroke: #f5f7f1; stroke-width: 5px; stroke-linejoin: round; }
      .edge { fill: none; stroke: #607d86; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .command { fill: none; stroke: #5f8795; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#command-arrow); }
      .event { fill: none; stroke: #778b60; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#event-arrow); }
      .command-label { fill: #4b7382; }
      .event-label { fill: #62764d; }
      .node { stroke-width: 1.6; }
    </style>
  </defs>

  <rect width="1080" height="350" rx="18" fill="#f5f7f1"/>
  <text x="44" y="45" class="title">模块通过对方队列双向通信</text>
  <text x="44" y="69" class="note">消息跨线程投递，状态只在所属线程中修改</text>

  <rect x="42" y="97" width="996" height="66" rx="14" fill="#edf5f7"/>
  <rect x="62" y="110" width="150" height="40" rx="10" class="node" fill="#c6dbe6" stroke="#7899a7"/>
  <text x="137" y="136" text-anchor="middle" class="label">网络线程</text>
  <rect x="300" y="110" width="210" height="40" rx="10" class="node" fill="#e3eef2" stroke="#7899a7"/>
  <text x="405" y="136" text-anchor="middle" class="label">网络消息队列</text>
  <path d="M510 130 H650" class="edge"/>
  <rect x="650" y="110" width="210" height="40" rx="10" class="node" fill="#c6dbe6" stroke="#7899a7"/>
  <text x="755" y="136" text-anchor="middle" class="label">网络状态机</text>

  <rect x="42" y="237" width="996" height="66" rx="14" fill="#f2f5e7"/>
  <rect x="62" y="250" width="150" height="40" rx="10" class="node" fill="#d3dca4" stroke="#8a9872"/>
  <text x="137" y="276" text-anchor="middle" class="label">播放器线程</text>
  <rect x="300" y="250" width="210" height="40" rx="10" class="node" fill="#e9eed2" stroke="#8a9872"/>
  <text x="405" y="276" text-anchor="middle" class="label">播放器消息队列</text>
  <path d="M510 270 H650" class="edge"/>
  <rect x="650" y="250" width="210" height="40" rx="10" class="node" fill="#d3dca4" stroke="#8a9872"/>
  <text x="755" y="276" text-anchor="middle" class="label">播放器状态机</text>

  <path d="M755 150 V184 H405 V250" class="command"/>
  <text x="580" y="177" text-anchor="middle" class="message command-label">Play / Stop</text>
  <path d="M860 270 H940 V86 H405 V110" class="event"/>
  <text x="675" y="82" text-anchor="middle" class="message event-label">PlayerStarted / PlayerFailed</text>
</svg>
